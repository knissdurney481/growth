[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "growth_twin"
version = "0.1.0"
description = "Digital Growth Twin: physics-informed multimodal modeling of pediatric growth, bone age, and pathogenic-variant prioritization"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Digital Growth Twin authors" }]
keywords = ["digital-twin", "physics-informed", "bone-age", "variant-prioritization", "pediatric-growth"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tyro>=0.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pretrained = ["timm>=0.9"]
dev = ["ruff", "black", "isort", "mypy", "pytest", "pre-commit"]

[project.scripts]
growth-twin = "growth_twin.cartographer.__main__:entrypoint"

[tool.setuptools.packages.find]
include = ["growth_twin*"]
exclude = ["tests*", "configs*", "scripts*", "docs*", "assets*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["growth_twin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_unused_ignores = false
ignore_missing_imports = true
files = ["growth_twin"]

[[tool.mypy.overrides]]
module = ["torch.*", "timm.*", "tyro.*", "yaml.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true
